<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mill Creek Engineering — Fab Lab Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cardinal: #8B2331; --navy: #0C223F; --navy-deep: #081627;
    --gold: #C7B683; --gold-deep: #AD9563; --cream: #F7F5F0; --paper: #FFFFFF;
    --ink: #1B2230; --slate: #5C6577; --slate-light: #98A1B0; --border: #E5E1D6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  button { font-family: inherit; cursor: pointer; }

  /* --- LOGIN SCREEN --- */
  #login-screen { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: var(--navy-deep); }
  #login-screen::before { content: ""; position: absolute; inset: 0; background: radial-gradient(600px circle at 20% 20%, var(--navy) 0%, transparent 60%); }
  .login-accent-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--cardinal), var(--gold)); }
  .login-card { position: relative; z-index: 1; width: 380px; padding: 32px; border-radius: 16px; background: var(--paper); }
  .brand-row { display: flex; align-items: center; gap: 8px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--cardinal); display: flex; align-items: center; justify-content: center; color: var(--gold); font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .brand-eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--slate-light); }
  .login-title { font-size: 20px; font-weight: 600; margin: 16px 0 4px; }
  .login-sub { font-size: 14px; color: var(--slate); margin: 0 0 24px; }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--slate); margin-bottom: 6px; }
  .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
  
  .submit-btn { width: 100%; display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: 8px; border: none; background: var(--navy); font-size: 14px; font-weight: 600; color: white; margin-top: 8px; }
  .submit-btn:hover { background: #16305c; }
  .login-footnote { font-size: 11px; text-align: center; margin-top: 16px; color: var(--slate-light); }
  .login-error { font-size: 12px; color: var(--cardinal); background: #8B233114; border: 1px solid var(--cardinal); border-radius: 8px; padding: 10px 12px; margin-top: 14px; display: none; }

  /* --- APP SHELL --- */
  #app-screen { display: none; width: 100vw; height: 100vh; }
  #app-screen.visible { display: flex; }
  #sidebar { width: 248px; flex-shrink: 0; background: var(--navy); display: flex; flex-direction: column; }
  .sidebar-header { display: flex; align-items: center; gap: 8px; padding: 20px; }
  .sidebar-brand-name { font-size: 14px; font-weight: 600; color: var(--cream); line-height: 1.2; }
  .sidebar-brand-sub { font-size: 11px; color: var(--gold); }
  #nav-list { flex: 1; padding: 8px 12px; margin-top: 8px; }
  .nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 12px; margin-bottom: 2px; border-radius: 8px; border: none; background: transparent; color: #9AA6BB; font-size: 14px; border-left: 2px solid transparent; text-align: left; }
  .nav-item.active { background: #FFFFFF12; color: var(--cream); border-left: 2px solid var(--gold); }
  .nav-item:not(.active):hover { background: #FFFFFF08; }
  .nav-item.disabled { opacity: 0.4; cursor: default; }
  .account-row { display: flex; align-items: center; gap: 10px; padding: 16px; border-top: 1px solid #FFFFFF14; }
  .account-avatar { width: 32px; height: 32px; border-radius: 999px; background: var(--gold); color: var(--navy); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; overflow: hidden; }
  .account-name { font-size: 12px; font-weight: 500; color: var(--cream); }
  .account-role { font-size: 11px; color: #7E8AA0; }
  .account-row button { margin-left: auto; background: none; border: none; display: flex; cursor: pointer; }

  .preview-wrap { padding: 0 12px 8px; position: relative; }
  .preview-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 8px; border: none; background: #FFFFFF08; color: #9AA6BB; font-size: 12px; }
  .preview-btn b { color: var(--gold); font-weight: 500; }
  .preview-menu { display: none; position: absolute; bottom: 44px; left: 12px; right: 12px; border-radius: 8px; overflow: hidden; background: var(--navy-deep); border: 1px solid #FFFFFF14; z-index: 20; }
  .preview-menu.open { display: block; }
  .preview-menu button { width: 100%; text-align: left; padding: 8px 12px; font-size: 12px; border: none; background: transparent; color: #C7CEDA; }
  .preview-menu button.current { color: var(--gold); }
  .preview-menu button:hover { background: #FFFFFF08; }

  #main { flex: 1; overflow-y: auto; padding: 32px; }
  .page-eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--slate-light); margin-bottom: 4px; }
  .page-title { font-size: 24px; font-weight: 600; margin: 0 0 24px; }
  .card { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; }
  .pill { font-size: 12px; font-weight: 500; padding: 4px 8px; border-radius: 999px; letter-spacing: 0.02em; }
  .pill.neutral { background: #EEEBE2; color: var(--slate); }
  .pill.gold { background: rgba(199,182,131,0.13); color: var(--gold-deep); }
  .pill.cardinal { background: rgba(139,35,49,0.08); color: var(--cardinal); }
  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; }
  .list-row + .list-row { border-top: 1px solid var(--border); }
  .row-title { font-size: 14px; font-weight: 500; }
  .row-sub { font-size: 12px; color: var(--slate-light); margin-top: 2px; }
  .empty-hint { padding: 32px; text-align: center; color: var(--slate-light); font-size: 13px; }

  .path-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .path-card { padding: 20px; display: flex; flex-direction: column; gap: 10px; text-align: left; border: 1px solid var(--border); background: var(--paper); border-radius: 12px; }
  .path-card.selected { border-color: var(--gold-deep); box-shadow: 0 0 0 2px rgba(199,182,131,0.3); }
  .path-card h3 { font-size: 14px; margin: 0; }
  .path-card p { font-size: 12px; color: var(--slate); line-height: 1.5; margin: 0; }

  .form-section { padding: 24px; margin-bottom: 20px; }
  .form-row { margin-bottom: 16px; }
  label.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--slate); margin-bottom: 6px; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: 'Inter';
  }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .file-drop { border: 1.5px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center; font-size: 13px; color: var(--slate); margin-top: 8px; }
  .file-drop.has-file { border-color: var(--gold-deep); color: var(--ink); }
  .primary-btn { background: var(--navy); color: white; border: none; padding: 11px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .primary-btn:hover { background: #16305c; }
  .primary-btn:disabled { opacity: 0.5; cursor: default; }
  .status-msg { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-top: 14px; display: none; }
  .status-msg.pending { background: #EEEBE2; color: var(--slate); display: block; }
  .status-msg.success { background: rgba(199,182,131,0.13); color: var(--gold-deep); display: block; }
  .status-msg.error { background: #8B233114; color: var(--cardinal); display: block; }

  .secondary-btn { background: transparent; color: var(--slate); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; }
  .secondary-btn:hover { background: #EFEDE5; }

  .queue-cols { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; align-items: start; }
  .queue-col { border-radius: 12px; padding: 12px; background: #EFEDE5; min-height: 140px; }
  .queue-col-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--slate); margin-bottom: 12px; }
  .queue-empty { font-size: 12px; color: var(--slate-light); }
  .queue-card { font-size: 12px; padding: 10px; border-radius: 8px; background: var(--paper); border: 1px solid var(--border); line-height: 1.4; margin-bottom: 10px; }
  .queue-card-title { font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
  .queue-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .mini-btn { font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 6px; border: none; background: var(--navy); color: white; }
  .mini-btn.danger { background: var(--cardinal); }
  .mini-btn.plain { background: #EEEBE2; color: var(--slate); }
  .flag-note { background: rgba(139,35,49,0.08); color: var(--cardinal); padding: 6px 8px; border-radius: 6px; font-size: 11px; margin: 6px 0; }
  .flag-form { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .flag-form-label { font-size: 11px; font-weight: 600; color: var(--slate); margin-bottom: 4px; }
  .flag-radio { display: block; font-size: 12px; color: var(--ink); margin-bottom: 4px; }
  .flag-form textarea { width: 100%; font-family: 'Inter'; font-size: 12px; padding: 6px; border: 1px solid var(--border); border-radius: 6px; margin-top: 4px; resize: vertical; }

  .row-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #EEEBE2; flex-shrink: 0; }
  .row-thumb-fallback { width: 44px; height: 44px; border-radius: 8px; background: #EEEBE2; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--slate-light); text-transform: uppercase; }
  .row-with-thumb { display: flex; align-items: center; gap: 14px; }
  .queue-thumb { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; background: #EEEBE2; margin-bottom: 8px; display: block; }
  .queue-thumb-fallback { width: 100%; height: 48px; border-radius: 6px; background: #EEEBE2; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--slate-light); text-transform: uppercase; }
</style>
</head>
<body>

<!-- LOGIN SCREEN (STUDENT ID ONLY) -->
<div id="login-screen">
  <div class="login-accent-bar"></div>
  <div class="login-card">
    <div class="brand-row">
      <div class="brand-mark">M</div>
      <span class="brand-eyebrow">Mill Creek Engineering</span>
    </div>
    <h1 class="login-title">Print &amp; laser queue</h1>
    <p class="login-sub">Enter your Student ID number to log in.</p>
    
    <form onsubmit="signInWithStudentNumber(event)">
      <div class="form-group">
        <label for="login-student-num">Student ID Number</label>
        <input type="text" id="login-student-num" placeholder="e.g. 123456" required autofocus />
      </div>

      <button type="submit" class="submit-btn" id="login-btn">
        Continue
      </button>
    </form>
    
    <div class="login-error" id="login-error"></div>
    <p class="login-footnote">Ask your teacher if your ID isn't working</p>
  </div>
</div>

<!-- APP SHELL -->
<div id="app-screen">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand-mark">M</div>
      <div>
        <div class="sidebar-brand-name">Mill Creek</div>
        <div class="sidebar-brand-sub">Fab Lab Queue</div>
      </div>
    </div>
    <nav id="nav-list"></nav>
    <div class="preview-wrap" id="preview-wrap"></div>
    <div class="account-row">
      <div class="account-avatar" id="account-avatar"></div>
      <div>
        <div class="account-name" id="account-name"></div>
        <div class="account-role" id="account-role"></div>
      </div>
      <button onclick="signOutUser()" title="Sign out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7E8AA0" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<!-- Thumbnail generation libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
/* =========================================================
   CONFIG
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAu-wxO-5Jr1jQvAH-gL6aYdoZD3yyNuKQ",
  authDomain: "makerspace-45087.firebaseapp.com",
  projectId: "makerspace-45087",
  storageBucket: "makerspace-45087.firebasestorage.app",
  messagingSenderId: "288948328757",
  appId: "1:288948328757:web:75791b67ddaaf30404147c",
  measurementId: "G-7055KGRPZD"
};

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6kKA3usKAwOvm2-DRr3xBMGd-2otkvJyKSmZXmqLGUMwgFv-_2ztACUsLUcJOIrHh9g/exec";

/* =========================================================
   INIT
========================================================= */
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

if (typeof pdfjsLib !== "undefined") {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

let currentUser = null;
let currentRole = "student";        
let currentStudentNumber = null;     
let previewRole = null;              
let state = { page: "home", submitPath: null, submitJobType: null, submitFile: null, previewMenuOpen: false, fixingPartId: null, fixFile: null };

const NAV = {
  student: [
    { key: "home", label: "Dashboard", enabled: true },
    { key: "submit", label: "Submit a Job", enabled: true },
    { key: "learn", label: "Learning", enabled: false },
  ],
  peer_leader: [
    { key: "queue", label: "Live Queue", enabled: true },
    { key: "batches", label: "Batches", enabled: true },
    { key: "printers", label: "Printer Status", enabled: true },
  ],
  teacher: [
    { key: "overview", label: "Overview", enabled: true },
    { key: "submit", label: "Submit a Job", enabled: true },
    { key: "reports", label: "Reports", enabled: false },
    { key: "printers", label: "Printer Status", enabled: true },
    { key: "filament", label: "Filament", enabled: true },
    { key: "roster", label: "Roster", enabled: true },
    { key: "queue", label: "Live Queue", enabled: true },
  ],
};
const ROLE_LABEL = { student: "Student", peer_leader: "Peer Leader", teacher: "Teacher / Admin" };

/* Check for existing user session on page load.
   Firestore's security rules require request.auth != null, so we need an
   anonymous Firebase Auth session established before any Firestore call. */
window.addEventListener("DOMContentLoaded", () => {
  auth.onAuthStateChanged((user) => {
    if (!user) {
      // Not signed in yet — kick off anonymous sign-in.
      // onAuthStateChanged will fire again once it completes.
      auth.signInAnonymously().catch((err) => {
        console.error("Anonymous sign-in failed:", err);
        showLoginError("Couldn't connect to the login service. Please refresh and try again.");
      });
      return;
    }
    // No session persistence by design — shared lab computers always show
    // the login screen and require a fresh Student ID entry every load.
  });
});

/* =========================================================
   STUDENT ID AUTHENTICATION
========================================================= */
async function signInWithStudentNumber(event) {
  if (event) event.preventDefault();
  
  const sNum = document.getElementById("login-student-num").value.trim();
  const errorEl = document.getElementById("login-error");
  errorEl.style.display = "none";

  if (!sNum) {
    showLoginError("Please enter your Student ID Number.");
    return;
  }

  const btn = document.getElementById("login-btn");
  btn.disabled = true;
  btn.textContent = "Verifying…";

  try {
    // Make sure we have an authenticated (anonymous) session before touching
    // Firestore — the security rules require request.auth != null.
    if (!auth.currentUser) {
      await auth.signInAnonymously();
    }

    // Roster docs might be keyed by doc ID = student number, OR keyed by
    // email with a studentNumber field inside — support both.
    let userDoc = null;
    const directDoc = await db.collection("users").doc(sNum).get();
    if (directDoc.exists) {
      userDoc = directDoc;
    } else {
      const querySnap = await db.collection("users").where("studentNumber", "==", sNum).limit(1).get();
      if (!querySnap.empty) userDoc = querySnap.docs[0];
    }

    if (!userDoc) {
      showLoginError("Student ID not found on roster. Please check with your teacher.");
      btn.disabled = false;
      btn.textContent = "Continue";
      return;
    }

    const userData = userDoc.data();

    // In-memory only for this page load — no localStorage persistence, so
    // shared lab computers never carry a session over to the next student.
    const sessionObj = {
      studentNumber: sNum,
      name: userData.name || `Student ${sNum}`,
      email: userData.email || `${sNum}@mc.edu`,
      role: userData.role || "student"
    };

    loadUserSession(sessionObj);
  } catch (err) {
    showLoginError("Login failed: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Continue";
  }
}

function loadUserSession(u) {
  currentUser = u;
  currentRole = u.role || "student";
  currentStudentNumber = u.studentNumber;

  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").classList.add("visible");
  previewRole = null;
  state.page = NAV[currentRole][0].key;
  renderShell();
}

function signOutUser() {
  currentUser = null;
  document.getElementById("app-screen").classList.remove("visible");
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("login-student-num").value = "";
}

function showLoginError(msg) {
  const el = document.getElementById("login-error");
  el.textContent = msg;
  el.style.display = "block";
}

/* =========================================================
   SHELL RENDER
========================================================= */
function effectiveRole() {
  return previewRole || currentRole;
}

function renderShell() {
  const nav = NAV[effectiveRole()];
  document.getElementById("nav-list").innerHTML = nav.map(item => {
    const active = state.page === item.key;
    const disabledClass = item.enabled ? "" : "disabled";
    return `<button class="nav-item ${active ? "active" : ""} ${disabledClass}"
      onclick="${item.enabled ? `setPage('${item.key}')` : ""}">${item.label}${item.enabled ? "" : " · soon"}</button>`;
  }).join("");

  document.getElementById("account-name").textContent = currentUser.name;
  document.getElementById("account-role").textContent =
    previewRole ? `${ROLE_LABEL[currentRole]} · previewing ${ROLE_LABEL[previewRole]}` : ROLE_LABEL[currentRole];
  
  const avatarEl = document.getElementById("account-avatar");
  avatarEl.textContent = (currentUser.name || "S")[0].toUpperCase();

  renderPreviewToggle();
  renderMain();
}

function renderPreviewToggle() {
  const wrap = document.getElementById("preview-wrap");
  if (currentRole !== "teacher") {
    wrap.innerHTML = "";
    return;
  }
  wrap.innerHTML = `
    <button class="preview-btn" onclick="togglePreviewMenu()">
      <span>Preview as: <b>${ROLE_LABEL[effectiveRole()]}</b></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="preview-menu ${state.previewMenuOpen ? "open" : ""}" id="preview-menu">
      ${Object.keys(NAV).map(r => `<button class="${r === effectiveRole() ? "current" : ""}" onclick="setPreviewRole('${r}')">${ROLE_LABEL[r]}</button>`).join("")}
    </div>
  `;
}

function togglePreviewMenu() {
  state.previewMenuOpen = !state.previewMenuOpen;
  renderPreviewToggle();
}

function setPreviewRole(r) {
  previewRole = (r === currentRole) ? null : r;
  state.previewMenuOpen = false;
  state.page = NAV[effectiveRole()][0].key;
  renderShell();
}

function setPage(key) {
  state.page = key;
  state.submitPath = null; state.submitJobType = null; state.submitFile = null;
  state.fixingPartId = null; state.fixFile = null;
  renderShell();
}

/* =========================================================
   MAIN ROUTER & DASHBOARD
========================================================= */
function renderMain() {
  const main = document.getElementById("main");
  if (state.page === "home") return renderHome(main);
  if (state.page === "submit") return renderSubmit(main);
  if (state.page === "queue") return renderQueue(main);
  if (state.page === "overview") return renderOverview(main);
  if (state.page === "batches") return renderBatchesPage(main);
  if (state.page === "printers") return renderPrintersPage(main);
  if (state.page === "filament") return renderFilamentPage(main);
  if (state.page === "roster") return renderRosterPage(main);
  main.innerHTML = `<div class="empty-hint">This page isn't built yet.</div>`;
}

async function renderHome(main) {
  main.innerHTML = `
    <div class="page-eyebrow">Student ID · ${currentUser.studentNumber}</div>
    <h1 class="page-title">Your submissions</h1>
    <div class="card" id="submissions-list"><div class="empty-hint">Loading…</div></div>
  `;

  await loadFilamentTypesCache();

  let snap;
  try {
    // Filter only (no orderBy) so this doesn't require a Firestore composite index —
    // we sort client-side instead.
    snap = await db.collection("submissions")
      .where("studentNumber", "==", currentStudentNumber)
      .get();
  } catch (err) {
    console.error("Failed to load submissions:", err);
    document.getElementById("submissions-list").innerHTML =
      `<div class="empty-hint">Couldn't load your submissions: ${escapeHtml(err.message)}</div>`;
    return;
  }

  if (snap.empty) {
    document.getElementById("submissions-list").innerHTML =
      `<div class="empty-hint">No submissions yet — head to "Submit a Job" to start one.</div>`;
    return;
  }

  const docsSorted = [...snap.docs].sort((a, b) => {
    const aTime = a.data().createdAt?.toMillis ? a.data().createdAt.toMillis() : 0;
    const bTime = b.data().createdAt?.toMillis ? b.data().createdAt.toMillis() : 0;
    return bTime - aTime;
  });

  const rowsHtml = [];
  for (const doc of docsSorted) {
    const sub = doc.data();
    const partsSnap = await db.collection("parts").where("submissionId", "==", doc.id).get();
    // A part that's been fully split across other batches (quantity hit 0) has
    // nothing left to track on its own — exclude it so counts stay accurate.
    const activeParts = partsSnap.docs.filter(p => (p.data().quantity ?? 1) > 0);
    const total = activeParts.length;
    const complete = activeParts.filter(p => ["Complete", "Picked up"].includes(p.data().status)).length;
    const flaggedPartDoc = activeParts.find(p => !!p.data().failureReason);
    const flagged = !!flaggedPartDoc;

    // Show the real current stage(s) rather than a static "Submitted" — a
    // submission usually has one active part, but a split (e.g. only some of
    // a quantity fit on a plate) can leave two active parts at different stages.
    const distinctStatuses = [...new Set(activeParts.map(p => p.data().status || "Submitted"))];
    const pillLabel = flagged
      ? "Needs attention"
      : (distinctStatuses.length === 1 ? distinctStatuses[0] : distinctStatuses.join(" + "));
    const tone = flagged ? "cardinal" : (complete === total && total > 0) ? "gold" : "neutral";
    const statusLabel = flagged
      ? (() => {
          const flaggedPart = flaggedPartDoc.data();
          return `Flagged — ${escapeHtml(flaggedPart.failureReason)}${flaggedPart.flagMessage ? ": " + escapeHtml(flaggedPart.flagMessage) : ""}`;
        })()
      : (total > 1 ? `${complete} of ${total} parts complete` : "");

    const firstPart = activeParts[0]?.data();
    const thumbHtml = renderThumbBox(firstPart, "row");

    const isFixing = flagged && state.fixingPartId === flaggedPartDoc.id;
    const fixButtonHtml = flagged && !isFixing
      ? `<button class="mini-btn" style="margin-top:8px;" onclick="startFixSubmission('${flaggedPartDoc.id}')">Fix & resubmit</button>`
      : "";

    rowsHtml.push(`<div class="list-row" style="${isFixing ? "flex-direction:column; align-items:stretch; gap:10px;" : ""}">
      <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
        <div class="row-with-thumb">
          ${thumbHtml}
          <div>
            <div class="row-title">${escapeHtml(sub.label || "Untitled submission")}</div>
            ${statusLabel ? `<div class="row-sub">${statusLabel}</div>` : ""}
            ${fixButtonHtml}
          </div>
        </div>
        <span class="pill ${tone}">${escapeHtml(pillLabel)}</span>
      </div>
      ${isFixing ? renderFixForm(flaggedPartDoc.id, flaggedPartDoc.data(), sub) : ""}
    </div>`);
  }
  document.getElementById("submissions-list").innerHTML = rowsHtml.join("");
}

// Shared thumbnail renderer for both the student dashboard row and queue cards.
// `size` is "row" (44px) or "card" (wider queue-card thumbnail).
function renderThumbBox(part, size) {
  const jobLabel = part && part.jobType === "laser" ? "Laser" : "Print";
  if (part && part.thumbnailDataUrl) {
    const cls = size === "row" ? "row-thumb" : "queue-thumb";
    return `<img class="${cls}" src="${part.thumbnailDataUrl}" alt="Preview" />`;
  }
  const cls = size === "row" ? "row-thumb-fallback" : "queue-thumb-fallback";
  return `<div class="${cls}">${jobLabel}</div>`;
}

function startFixSubmission(partId) {
  state.fixingPartId = partId;

function cancelFixSubmission() {

      <label class="field-label">Ideal color</label>

function onFixLaserMaterialChange(partId) {
  const select = document.getElementById(`fix-material-select-${partId}`);
  const otherInput = document.getElementById(`fix-material-other-${partId}`);
  if (!select || !otherInput) return;
  otherInput.style.display = select.value === "Other" ? "block" : "none";
}

async function resubmitFixedPart(partId) {
  const part = queueCache?.parts?.find?.((p) => p.id === partId); // may be undefined outside the queue; fall back to a fresh read below
  const statusEl = document.getElementById(`fix-status-${partId}`);
  const setFixStatus = (kind, text) => {
    if (!statusEl) return;
    statusEl.className = "status-msg " + kind;
    statusEl.textContent = text;
  };

  const partDoc = await db.collection("parts").doc(partId).get();
  if (!partDoc.exists) { setFixStatus("error", "Couldn't find this part — try refreshing."); return; }
  const partData = partDoc.data();
  const isLaser = partData.jobType === "laser";

  const label = document.getElementById(`fix-label-${partId}`).value.trim();
  const quantity = parseInt(document.getElementById(`fix-quantity-${partId}`).value, 10);
  const color = isLaser ? "" : document.getElementById(`fix-color-${partId}`).value.trim();

  let material;
  if (isLaser) {
    const materialSelect = document.getElementById(`fix-material-select-${partId}`).value;
    material = materialSelect === "Other"
      ? document.getElementById(`fix-material-other-${partId}`).value.trim()
      : materialSelect;
  } else {
    material = document.getElementById(`fix-material-${partId}`).value.trim();
  }

  if (!label || !material || (!isLaser && !color) || isNaN(quantity) || quantity < 1) {
    setFixStatus("error", "Please fill out all fields with valid inputs.");
    return;
  }
  if (!state.fixFile) {
    setFixStatus("error", "Please choose a corrected file to upload.");
    return;
  }

  const fileName = state.fixFile.name.toLowerCase();
  const allowedExts = isLaser ? ['.ai', '.pdf'] : ['.3mf', '.stl'];
  if (!allowedExts.some((ext) => fileName.endsWith(ext))) {
    setFixStatus("error", isLaser ? "Upload an .ai or .pdf file." : "Upload a .3mf or .stl file.");
    return;
  }

  setFixStatus("pending", "Generating preview…");
  try {
    const thumbnailDataUrl = await generateThumbnail(state.fixFile, partData.jobType);

    setFixStatus("pending", "Uploading corrected file…");
    const uploadResult = await uploadFileViaAppsScript(state.fixFile, partData.submissionId, partId);

    await db.collection("submissions").doc(partData.submissionId).update({ label });
    await db.collection("parts").doc(partId).update({
      quantity,
      material,
      color: color || null,
      fileRef: uploadResult.fileUrl,
      downloadUrl: uploadResult.downloadUrl,
      thumbnailDataUrl: thumbnailDataUrl || null,
      status: "Submitted",
      currentAssignee: null,
      failureReason: null,
      flagMessage: null,
      statusHistory: firebase.firestore.FieldValue.arrayUnion({
        status: "Submitted",
        timestamp: new Date().toISOString(),
        actor: currentUser.name,
        note: `Resubmitted after being flagged: ${partData.failureReason || "issue"}`,
      }),
    });

    setFixStatus("success", "Resubmitted! Back at the start of the queue.");
    state.fixingPartId = null;
    state.fixFile = null;
    setTimeout(() => renderHome(document.getElementById("main")), 1000);
  } catch (err) {
    setFixStatus("error", "Something went wrong: " + err.message);
  }
}

/* =========================================================
   THUMBNAIL GENERATION (client-side, best-effort)
   Never blocks a submission — any failure just falls back to no thumbnail.
========================================================= */
const THUMB_MAX_DIM = 240;
const STL_THUMB_SIZE_LIMIT_BYTES = 60 * 1024 * 1024; // skip STL rendering above this to avoid freezing slower devices
const THUMB_TIMEOUT_MS = 15000;

async function generateThumbnail(file, jobType) {
  try {
    const withTimeout = (promise) => Promise.race([
      promise,
      new Promise((resolve) => setTimeout(() => resolve(null), THUMB_TIMEOUT_MS)),
    ]);

    const name = file.name.toLowerCase();
    if (name.endsWith(".3mf")) return await withTimeout(thumbnailFrom3mf(file));
    if (name.endsWith(".pdf") || name.endsWith(".ai")) return await withTimeout(thumbnailFromPdf(file));
    if (name.endsWith(".stl")) {
      if (file.size > STL_THUMB_SIZE_LIMIT_BYTES) return null; // too big to safely render client-side
      return await withTimeout(thumbnailFromStl(file));
    }
    return null;
  } catch (err) {
    console.warn("Thumbnail generation skipped:", err);
    return null;
  }
}

function resizeToThumbnail(imgSource, srcW, srcH) {
  const scale = Math.min(THUMB_MAX_DIM / srcW, THUMB_MAX_DIM / srcH, 1);
  const w = Math.max(1, Math.round(srcW * scale));
  const h = Math.max(1, Math.round(srcH * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(imgSource, 0, 0, w, h);
  return canvas.toDataURL("image/jpeg", 0.75);
}

// .3mf is secretly a ZIP file; Bambu Studio embeds a plate thumbnail PNG inside it —
// no rendering required, just extract the largest embedded PNG.
async function thumbnailFrom3mf(file) {
  if (typeof JSZip === "undefined") return null;
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const pngEntries = zip.file(/\.png$/i);
  if (!pngEntries || pngEntries.length === 0) return null;

  let bestBlob = null;
  let bestSize = -1;
  for (const entry of pngEntries) {
    const blob = await entry.async("blob");
    if (blob.size > bestSize) { bestSize = blob.size; bestBlob = blob; }
  }
  if (!bestBlob) return null;

  return await new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(bestBlob);
    img.onload = () => {
      try {
        const dataUrl = resizeToThumbnail(img, img.naturalWidth, img.naturalHeight);
        URL.revokeObjectURL(url);
        resolve(dataUrl);
      } catch (e) { reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't decode embedded thumbnail")); };
    img.src = url;
  });
}

// Laser files: .pdf directly, or .ai saved with "Create PDF Compatible File" (Illustrator's
// default), which makes the .ai valid PDF under the hood. Renders page 1 to a canvas.
async function thumbnailFromPdf(file) {
  if (typeof pdfjsLib === "undefined") return null;
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const page = await pdf.getPage(1);
  const baseViewport = page.getViewport({ scale: 1 });
  const scale = THUMB_MAX_DIM / Math.max(baseViewport.width, baseViewport.height);
  const viewport = page.getViewport({ scale });

  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas.toDataURL("image/jpeg", 0.75);
}

// Raw .stl has no embedded image — load the mesh into a throwaway Three.js scene,
// auto-frame a camera around it, and snapshot a single render.
async function thumbnailFromStl(file) {
  if (typeof THREE === "undefined" || typeof THREE.STLLoader === "undefined") return null;
  const buf = await file.arrayBuffer();
  const loader = new THREE.STLLoader();
  const geometry = loader.parse(buf);
  geometry.computeBoundingSphere();
  geometry.computeVertexNormals();

  const size = THUMB_MAX_DIM;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: false });
  try {
    renderer.setSize(size, size);
    renderer.setClearColor(0xF7F5F0, 1);

    const scene = new THREE.Scene();
    const material = new THREE.MeshNormalMaterial(); // needs no lights, always renders visibly
    const mesh = new THREE.Mesh(geometry, material);

    const sphere = geometry.boundingSphere;
    const center = sphere ? sphere.center : new THREE.Vector3(0, 0, 0);
    const radius = (sphere && sphere.radius) ? sphere.radius : 1;

    mesh.position.set(-center.x, -center.y, -center.z);
    scene.add(mesh);

    const camera = new THREE.PerspectiveCamera(35, 1, Math.max(radius * 0.01, 0.001), radius * 20);
    const dist = radius * 2.6;
    camera.position.set(dist, dist * 0.8, dist);
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
    const dataUrl = renderer.domElement.toDataURL("image/jpeg", 0.8);

    material.dispose();
    return dataUrl;
  } finally {
    geometry.dispose();
    renderer.dispose();
  }
}

function setSubmitStatus(kind, text) {
  const el = document.getElementById("submit-status");
  el.className = "status-msg " + kind;
  el.textContent = text;
}

async function submitJob() {
  const label = document.getElementById("f-label").value.trim();
  const jobType = state.submitJobType;
  const quantity = parseInt(document.getElementById("f-quantity").value, 10);

  let material;
  if (jobType === "laser") {
    const materialSelect = document.getElementById("f-material-select").value;
    material = materialSelect === "Other"
      ? document.getElementById("f-material-other").value.trim()
      : materialSelect;
  } else {
    material = document.getElementById("f-material").value.trim();
  }

  const isLaserJob = jobType === "laser";
  const color = isLaserJob ? "" : document.getElementById("f-color").value.trim();

  if (!label || !material || (!isLaserJob && !color) || isNaN(quantity) || quantity < 1) { 
    setSubmitStatus("error", "Please fill out all fields with valid inputs."); 
    return; 
  }
  if (!state.submitFile) { 
    setSubmitStatus("error", "Please choose a file to upload."); 
    return; 
  }

  const fileName = state.submitFile.name.toLowerCase();
  const allowedPrintExts = ['.3mf', '.stl'];
  const allowedLaserExts = ['.ai', '.pdf'];
  
  if (jobType === "print" && !allowedPrintExts.some(ext => fileName.endsWith(ext))) {
    setSubmitStatus("error", "Invalid file format for 3D Prints. Upload a .3mf or .stl file.");
    return;
  }
  if (jobType === "laser" && !allowedLaserExts.some(ext => fileName.endsWith(ext))) {
    setSubmitStatus("error", "Invalid file format for Laser. Upload an .ai or .pdf file.");
    return;
  }

  document.getElementById("submit-btn").disabled = true;
  setSubmitStatus("pending", "Creating submission…");

  try {
    const submissionRef = await db.collection("submissions").add({
      studentNumber: currentStudentNumber,
      label,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      overallStatus: "Submitted",
    });

    setSubmitStatus("pending", "Generating preview…");
    const thumbnailDataUrl = await generateThumbnail(state.submitFile, jobType);

    setSubmitStatus("pending", "Creating submission…");
    const partRef = await db.collection("parts").add({
      submissionId: submissionRef.id,
      jobType,
      quantity,
      material,
      color: color || null,
      batchable: state.submitPath === "batch",
      status: "Submitted",
      statusHistory: [{
        status: "Submitted",
        timestamp: new Date().toISOString(),
        actor: currentUser.name,
        note: state.submitPath === "assisted" ? "Peer-leader slicing requested" : null,
      }],
      currentAssignee: null,
      handoffNote: null,
      fileRef: null,
      thumbnailDataUrl: thumbnailDataUrl || null,
    });

    setSubmitStatus("pending", "Uploading file…");
    const uploadResult = await uploadFileViaAppsScript(state.submitFile, submissionRef.id, partRef.id);
    await db.collection("parts").doc(partRef.id).update({ fileRef: uploadResult.fileUrl, downloadUrl: uploadResult.downloadUrl });

    sendMilestoneEmail(currentUser.email, label, "Submitted"); // fire-and-forget, doesn't block the UI

    setSubmitStatus("success", "Submitted! Head to your dashboard to track it.");
    setTimeout(() => setPage("home"), 1200);
  } catch (err) {
    setSubmitStatus("error", "Something went wrong: " + err.message);
    document.getElementById("submit-btn").disabled = false;
  }
}

function uploadFileViaAppsScript(file, submissionId, partId) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = reader.result.split(",")[1];
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "uploadFile",
            submissionId,
            partId,
            fileName: file.name,
            mimeType: file.type || "application/octet-stream",
            fileDataBase64: base64,
          }),
        });
        const data = await res.json();
        if (!data.ok) return reject(new Error(data.error || "Upload failed"));
        resolve({ fileUrl: data.fileUrl, downloadUrl: data.downloadUrl });
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = () => reject(new Error("Couldn't read the file"));
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   MILESTONE EMAILS
   Only fired for Submitted, Complete, and Flagged — the states that are
   either rare/high-signal or genuinely need the student to take action.
   Claimed/Prepping/Printing-started are deliberately skipped so a peer
   leader's accidental advance-then-send-back doesn't spam a student; that
   in-between progress is still fully recorded in each part's statusHistory.
========================================================= */
async function getStudentEmailByNumber(studentNumber) {
  if (!studentNumber) return null;
  try {
    const directDoc = await db.collection("users").doc(studentNumber).get();
    if (directDoc.exists) return directDoc.data().email || null;
    const querySnap = await db.collection("users").where("studentNumber", "==", studentNumber).limit(1).get();
    if (!querySnap.empty) return querySnap.docs[0].data().email || null;
  } catch (err) {
    console.warn("Couldn't look up student email:", err);
  }
  return null;
}

async function sendMilestoneEmail(recipientEmail, label, status, extra = {}) {
  if (!recipientEmail) return;
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "sendStatusEmail", recipientEmail, label, status, ...extra }),
    });
  } catch (err) {
    console.warn("Milestone email failed to send:", err);
  }
}

// Convenience: look up the owning student's email for a part's submission and
// fire a milestone email — used from the queue where the acting user (a peer
// leader) is not the recipient.
async function sendMilestoneEmailForPart(part, status, extra = {}) {
  const sub = queueCache.submissions[part.submissionId];
  if (!sub) return;
  const email = await getStudentEmailByNumber(sub.studentNumber);
  if (email) sendMilestoneEmail(email, sub.label || "Your job", status, extra);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function checkStorageUsage() {
  const btn = document.getElementById("storage-check-btn");
  const resultEl = document.getElementById("storage-result");
  btn.disabled = true;
  btn.textContent = "Checking…";
  resultEl.innerHTML = `<div class="empty-hint">Scanning submission folders — this can take a moment if there are a lot of files…</div>`;

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "getStorageUsage" }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Unknown error");

    const usedLabel = formatBytes(data.totalBytes);
    const pct = ((data.totalBytes / (15 * 1024 * 1024 * 1024)) * 100).toFixed(1);

    resultEl.innerHTML = `
      <div class="list-row" style="padding:0 0 12px;">
        <div>
          <div class="row-title">${usedLabel} used</div>
          <div class="row-sub">${data.fileCount} file${data.fileCount === 1 ? "" : "s"} across ${data.submissionFolderCount} submission folder${data.submissionFolderCount === 1 ? "" : "s"}</div>
        </div>
        <span class="pill gold">${pct}% of 15 GB</span>
      </div>
      <a href="${data.rootFolderUrl}" target="_blank" rel="noopener" class="row-sub" style="text-decoration:underline;">Open the submissions folder in Drive →</a>
    `;
  } catch (err) {
    resultEl.innerHTML = `<div class="empty-hint">Couldn't check storage: ${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Check storage used";
  }
}

function formatBytes(bytes) {
  if (bytes === 0) return "0 MB";
  const mb = bytes / (1024 * 1024);
  if (mb < 1024) return mb.toFixed(1) + " MB";
  return (mb / 1024).toFixed(2) + " GB";
}

function renderBatchSelectSummary() {
  const el = document.getElementById("batch-select-summary");

  const n = selectedPartIds.size;
  el.innerHTML = `

    <button class="mini-btn" ${n < 2 ? "disabled" : ""} onclick="combineSelectedIntoBatch()">Combine into batch</button>
  `;
}

function toggleBatchSelectMode() {
  batchSelectMode = !batchSelectMode;
  selectedPartIds = new Set();
  selectedPartQuantities = new Map();
  renderQueue(document.getElementById("main"));
}

function togglePartSelected(partId) {
  const part = queueCache.parts.find((p) => p.id === partId);
  if (!part) return;

  if (selectedPartIds.has(partId)) {
    selectedPartIds.delete(partId);
    selectedPartQuantities.delete(partId);
  } else {
    // Once something's selected, only allow adding parts that are at the same
    // pipeline stage, the same job type, and the same material — batching means
    // physically combining these onto one plate or sheet, so all three have to match.
    if (selectedPartIds.size > 0) {
      const refPart = queueCache.parts.find((p) => p.id === [...selectedPartIds][0]);
      if (refPart) {
        if (refPart.status !== part.status) {
          alert(`These parts aren't at the same stage. Pick parts that are all currently "${refPart.status}."`);
          return;
        }
        if (refPart.jobType !== part.jobType) {
          alert("Can't combine a 3D print job and a laser job into the same batch.");
          return;
        }
        if ((refPart.material || "").trim().toLowerCase() !== (part.material || "").trim().toLowerCase()) {
          alert(`These parts use different materials ("${refPart.material || "none set"}" vs "${part.material || "none set"}"). They need to match to go on the same plate or sheet.`);
          return;
        }
      }
    }
    selectedPartIds.add(partId);
    selectedPartQuantities.set(partId, part.quantity || 1); // default to the full remaining amount
  }
  renderQueueBoard();
}

function setSelectedPartQty(partId, value) {
  const part = queueCache.parts.find((p) => p.id === partId);
  if (!part) return;
  let qty = parseInt(value, 10);
  if (isNaN(qty) || qty < 1) qty = 1;
  if (qty > (part.quantity || 1)) qty = part.quantity || 1;
  selectedPartQuantities.set(partId, qty);
  renderQueueBoard();
}

async function combineSelectedIntoBatch() {
  if (selectedPartIds.size < 2) return;
  const ids = [...selectedPartIds];

  // Defensive re-check in case cached state drifted from what's on screen.
  const chosen = ids.map((id) => queueCache.parts.find((p) => p.id === id)).filter(Boolean);
  const statuses = new Set(chosen.map((p) => p.status));
  if (statuses.size > 1) {
    alert("Selected parts must all be at the same stage to combine into a batch.");
    return;
  }
  const jobTypes = new Set(chosen.map((p) => p.jobType));
  if (jobTypes.size > 1) {
    alert("Can't combine 3D print and laser jobs into the same batch.");
    return;
  }
  const materials = new Set(chosen.map((p) => (p.material || "").trim().toLowerCase()));
  if (materials.size > 1) {
    alert("Selected parts must all use the same material to combine into a batch.");
    return;
  }

  const batchRef = await db.collection("batches").add({
    status: "Active",
    printerId: null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    createdBy: currentUser.name,
    currentAssignee: currentUser.name,
    handoffNote: null,
  });

  const writeBatch = db.batch();

  chosen.forEach((part) => {
    const totalQty = part.quantity || 1;
    let batchQty = selectedPartQuantities.get(part.id) || totalQty;
    if (batchQty > totalQty) batchQty = totalQty;

    if (batchQty >= totalQty) {
      // Whole part goes into the batch — no split needed.
      writeBatch.update(db.collection("parts").doc(part.id), { batchId: batchRef.id });
      return;
    }

    // Only some of this part's quantity fits on this plate. Peel off a new
    // part doc carrying just that amount into the batch, and leave the
    // original behind (still active in the queue) with the remainder.
    const splitRef = db.collection("parts").doc();
    writeBatch.set(splitRef, {
      submissionId: part.submissionId,
      jobType: part.jobType,
      quantity: batchQty,
      material: part.material || null,
      color: part.color || null,
      batchable: true,
      status: part.status,
      statusHistory: [{
        status: part.status,
        timestamp: new Date().toISOString(),
        actor: currentUser.name,
        note: `Split from an ${totalQty}-unit request — ${batchQty} of ${totalQty} going into this batch`,
      }],
      currentAssignee: currentUser.name,
      handoffNote: null,
      fileRef: part.fileRef || null,
      thumbnailDataUrl: part.thumbnailDataUrl || null,
      printerId: null,
      batchId: batchRef.id,
      splitFromPartId: part.id,
    });

    writeBatch.update(db.collection("parts").doc(part.id), {
      quantity: totalQty - batchQty,
      splitHistory: firebase.firestore.FieldValue.arrayUnion({
        intoPartId: splitRef.id,
        batchId: batchRef.id,
        quantity: batchQty,
        timestamp: new Date().toISOString(),
      }),
      statusHistory: firebase.firestore.FieldValue.arrayUnion({
        status: part.status,
        timestamp: new Date().toISOString(),
        actor: currentUser.name,
        note: `Split off ${batchQty} of ${totalQty} into a batch — ${totalQty - batchQty} remaining here`,
      }),
    });
  });

  await writeBatch.commit();

  batchSelectMode = false;
  selectedPartIds = new Set();
  selectedPartQuantities = new Map();
  await refreshQueue();
}

function batchSiblings(batchId, excludePartId) {
  return queueCache.parts.filter((p) => p.batchId === batchId && p.id !== excludePartId);
}

async function removeFromBatch(partId) {
  const part = queueCache.parts.find((p) => p.id === partId);
  if (!part || !part.batchId) return;
  const batchId = part.batchId;
  const siblings = batchSiblings(batchId, partId);

  if (siblings.length <= 1) {
    // Only one (or zero) member would remain — dissolve the batch entirely
    // rather than leave a "batch of one" behind.
    const writeBatch = db.batch();
    writeBatch.update(db.collection("parts").doc(partId), { batchId: null });
    siblings.forEach((p) => writeBatch.update(db.collection("parts").doc(p.id), { batchId: null }));
    writeBatch.delete(db.collection("batches").doc(batchId));
    await writeBatch.commit();
  } else {
    await db.collection("parts").doc(partId).update({ batchId: null });
  }
  await refreshAfterQueueMutation();
}

async function dissolveBatch(batchId) {
  const members = queueCache.parts.filter((p) => p.batchId === batchId);
  const writeBatch = db.batch();
  members.forEach((p) => writeBatch.update(db.collection("parts").doc(p.id), { batchId: null }));
  writeBatch.delete(db.collection("batches").doc(batchId));
  await writeBatch.commit();
  await refreshAfterQueueMutation();
}

// resultsMap is optional: { partId: succeededQty }. If omitted, every member's
// full quantity is treated as having succeeded (the simple, common case).
// Any member where succeeded < total gets split: the successful portion moves
// forward on its own; the remainder is sent back one step and detached from
// the batch so it can be re-planned (e.g. re-batched for another run) independently.
async function advanceBatch(batchId, resultsMap = null) {
  const members = queueCache.parts.filter((p) => p.batchId === batchId);
  const writeBatch = db.batch();
  const completedMembers = [];
  let anyChange = false;

  members.forEach((p) => {
    const next = NEXT_STATUS[p.status];
    if (!next) return;

    const total = p.quantity || 1;
    let succeeded = resultsMap ? resultsMap[p.id] : total;
    if (succeeded === undefined || succeeded === null || isNaN(succeeded)) succeeded = total;
    succeeded = Math.max(0, Math.min(succeeded, total));
    const failed = total - succeeded;

    if (succeeded === 0) {
      // Nothing from this member succeeded — send the whole thing back one
      // step, detached from the batch so it isn't stuck waiting on siblings.
      const prev = PREV_STATUS[p.status] || p.status;
      anyChange = true;
      const updates = {
        status: prev,
        batchId: null,
        statusHistory: firebase.firestore.FieldValue.arrayUnion({
          status: prev,
          timestamp: new Date().toISOString(),
          actor: currentUser.name,
          note: `0 of ${total} succeeded on this run — sent back for another attempt`,
        }),
      };
      if (p.status === "Printing/Lasering") updates.printerId = null;
      if (prev === "Submitted") updates.currentAssignee = null;
      writeBatch.update(db.collection("parts").doc(p.id), updates);
      return;
    }

    anyChange = true;

    if (failed === 0) {
      // Clean success — the whole member advances together, batch stays intact.
      if (next === "Complete") completedMembers.push(p);
      writeBatch.update(db.collection("parts").doc(p.id), {
        status: next,
        currentAssignee: currentUser.name,
        failureReason: null,
        flagMessage: null,
        statusHistory: firebase.firestore.FieldValue.arrayUnion({
          status: next,
          timestamp: new Date().toISOString(),
          actor: currentUser.name,
          note: "Advanced as part of batch",
        }),
      });
      return;
    }

    // Partial success — split. The succeeded portion becomes its own record
    // moving forward; the remainder stays behind, sent back one step.
    const successRef = db.collection("parts").doc();
    writeBatch.set(successRef, {
      submissionId: p.submissionId,
      jobType: p.jobType,
      quantity: succeeded,
      material: p.material || null,
      color: p.color || null,
      batchable: true,
      status: next,
      statusHistory: [{
        status: next,
        timestamp: new Date().toISOString(),
        actor: currentUser.name,
        note: `${succeeded} of ${total} succeeded on this batch run`,
      }],
      currentAssignee: currentUser.name,
      handoffNote: null,
      fileRef: p.fileRef || null,
      downloadUrl: p.downloadUrl || null,
      thumbnailDataUrl: p.thumbnailDataUrl || null,
      printerId: p.printerId || null,
      batchId: null,
      splitFromPartId: p.id,
    });
    if (next === "Complete") completedMembers.push({ submissionId: p.submissionId });

    const prev = PREV_STATUS[p.status] || p.status;
    const failUpdates = {
      quantity: failed,
      batchId: null,
      splitHistory: firebase.firestore.FieldValue.arrayUnion({
        intoPartId: successRef.id,
        batchId: batchId,
        quantity: succeeded,
        timestamp: new Date().toISOString(),
      }),
      status: prev,
      statusHistory: firebase.firestore.FieldValue.arrayUnion({
        status: prev,
        timestamp: new Date().toISOString(),
        actor: currentUser.name,
        note: `${succeeded} of ${total} succeeded — ${failed} sent back for another attempt`,
      }),
    };
    if (p.status === "Printing/Lasering") failUpdates.printerId = null;
    if (prev === "Submitted") failUpdates.currentAssignee = null;
    writeBatch.update(db.collection("parts").doc(p.id), failUpdates);
  });

  if (anyChange) await writeBatch.commit();
  completedMembers.forEach((p) => sendMilestoneEmailForPart(p, "Complete"));
  await refreshAfterQueueMutation();
}

/* ---- Machine assignment ---- */

async function assignMachine(partId, machineId) {
  await db.collection("parts").doc(partId).update({ printerId: machineId || null });
  await refreshAfterQueueMutation();
}

async function assignBatchMachine(batchId, machineId) {
  const members = queueCache.parts.filter((p) => p.batchId === batchId);
  const writeBatch = db.batch();
  writeBatch.update(db.collection("batches").doc(batchId), { printerId: machineId || null });
  members.forEach((p) => writeBatch.update(db.collection("parts").doc(p.id), { printerId: machineId || null }));
  await writeBatch.commit();
  await refreshAfterQueueMutation();
}

function machineLabel(machineId) {
  const m = machinesCache.find((m) => m.id === machineId);
  return m ? m.label : machineId;
}

function renderQueueCard(part, submission) {
  const label = submission ? submission.label : "Unknown submission";
  const flagged = !!part.failureReason && part.status === "Claimed";
  const nextLabel = NEXT_LABEL[part.status];
  const prevStatus = PREV_STATUS[part.status];
  const showFlagBtn = ["Claimed", "Prepping/slicing", "Printing/Lasering"].includes(part.status);
  const isLaser = part.jobType === "laser";
  const machines = machinesForType(part.jobType);
  const accentColor = isLaser ? "var(--cardinal)" : "var(--navy)";

  const isSelected = selectedPartIds.has(part.id);
  const selectCheckbox = batchSelectMode
    ? `<div style="margin-bottom:8px;">
        <label style="display:flex; align-items:center; gap:6px; font-size:11px; color: var(--slate);">
          <input type="checkbox" ${isSelected ? "checked" : ""} onchange="togglePartSelected('${part.id}')" /> Select for batch
        </label>
        ${isSelected && (part.quantity || 1) > 1 ? `<label style="display:flex; align-items:center; gap:6px; font-size:11px; color: var(--slate); margin-top:6px;">
          Qty for this ${isLaser ? "sheet" : "plate"}:
          <input type="number" min="1" max="${part.quantity}" value="${selectedPartQuantities.get(part.id) || part.quantity}" style="width:56px;" onchange="setSelectedPartQty('${part.id}', this.value)" />
          <span>of ${part.quantity}</span>
        </label>` : ""}
      </div>`
    : "";

  // Lets a peer leader send only part of the remaining quantity forward
  // (e.g. 6 of 10 fit on this plate/sheet run) without touching batching at
  // all — the rest simply stays here, unclaimed, for anyone to pick up next.
  const canPartialAdvance = !!nextLabel && !part.batchId && (part.quantity || 1) > 1;
  const advanceQtyControlHtml = canPartialAdvance
    ? `<div style="margin:8px 0 2px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
        <label class="row-sub" style="margin:0;">${nextLabel}:</label>
        <input type="number" min="1" max="${part.quantity}" value="${part.quantity}" id="advance-qty-${part.id}" style="width:56px;" />
        <span class="row-sub" style="display:inline;">of ${part.quantity} — the rest stays here, unclaimed</span>
      </div>`
    : "";

  const machineSelectHtml = (!part.batchId && machines.length && part.status === "Printing/Lasering")
    ? `<div class="form-row" style="margin:8px 0 0;">
        <label class="flag-form-label">Machine</label>
        <select onchange="assignMachine('${part.id}', this.value)">
          <option value="">— Unassigned —</option>
          ${machines.map((m) => `<option value="${m.id}" ${part.printerId === m.id ? "selected" : ""}>${escapeHtml(m.label)}</option>`).join("")}
        </select>
      </div>`
    : "";

  return `<div class="queue-card" style="border-left: 3px solid ${accentColor};">
    ${selectCheckbox}
    ${renderThumbBox(part, "card")}
    <span class="pill ${isLaser ? "cardinal" : "gold"}" style="margin-bottom:6px; display:inline-block;">${isLaser ? "✂ Laser" : "🖨 Print"}</span>
    <div class="queue-card-title">${escapeHtml(label)}</div>
    <div class="row-sub mono">qty ${part.quantity || 1}${part.material ? " · " + escapeHtml(part.material) : ""}</div>
    ${part.fileRef ? `<div class="queue-actions" style="margin:6px 0 0;">
      <a href="${part.fileRef}" target="_blank" rel="noopener" class="mini-btn plain" style="text-decoration:none;">View file</a>
      ${part.downloadUrl ? `<a href="${part.downloadUrl}" target="_blank" rel="noopener" class="mini-btn" style="text-decoration:none;">Download</a>` : ""}
    </div>` : ""}
    ${(part.splitHistory && part.splitHistory.length) ? `<div class="row-sub">${part.splitHistory.reduce((s, h) => s + h.quantity, 0)} already split off (batched or advanced separately) — ${part.quantity || 0} left here</div>` : ""}
    ${part.splitFromPartId ? `<div class="row-sub">Split off from a larger request</div>` : ""}
    ${part.batchId ? renderBatchBadge(part) : ""}
    ${flagged ? `<div class="flag-note">Flagged — ${escapeHtml(part.failureReason)}${part.flagMessage ? ": " + escapeHtml(part.flagMessage) : ""}</div>` : ""}
    ${part.currentAssignee ? `<div class="row-sub">Assignee: ${escapeHtml(part.currentAssignee)}</div>` : ""}
    ${part.handoffNote ? `<div class="row-sub">Note: ${escapeHtml(part.handoffNote)}</div>` : ""}
    ${!part.batchId && part.printerId ? `<div class="row-sub">Machine: ${escapeHtml(machineLabel(part.printerId))}</div>` : ""}
    ${machineSelectHtml}
    ${flaggingPartId === part.id
      ? renderFlagForm(part.id)
      : `${advanceQtyControlHtml}
        <div class="queue-actions">
          ${nextLabel && !canPartialAdvance ? `<button class="mini-btn" onclick="advancePart('${part.id}','${part.status}')">${nextLabel}</button>` : ""}
          ${canPartialAdvance ? `<button class="mini-btn" onclick="advancePart('${part.id}','${part.status}')">Confirm</button>` : ""}
          ${prevStatus ? `<button class="mini-btn plain" onclick="sendBackPart('${part.id}','${part.status}')">Send back</button>` : ""}

          <button class="mini-btn danger" onclick="withdrawPart('${part.id}')">Withdraw</button>
        </div>`}
  </div>`;
}

async function advancePart(partId, currentStatus) {
  const next = NEXT_STATUS[currentStatus];
  if (!next) return;

  const part = queueCache.parts.find((p) => p.id === partId);
  if (!part) return;
  const total = part.quantity || 1;

  // If this card is showing a qty-to-advance input, respect it. Otherwise
  // (qty 1, or the card doesn't offer partial advance) the whole thing moves.
  let qty = total;
  const qtyInput = document.getElementById(`advance-qty-${partId}`);
  if (qtyInput) {
    const parsed = parseInt(qtyInput.value, 10);
    if (!isNaN(parsed) && parsed > 0) qty = Math.min(parsed, total);
  }

  const writeBatch = db.batch();

  if (qty >= total) {
    // Whole part advances together — no split needed.
    writeBatch.update(db.collection("parts").doc(partId), {
      status: next,
      currentAssignee: currentUser.name,
      failureReason: null,
      flagMessage: null,
      statusHistory: firebase.firestore.FieldValue.arrayUnion({
        status: next,
        timestamp: new Date().toISOString(),
        actor: currentUser.name,
        note: null,
      }),
    });
  } else {
    // Only `qty` of `total` is moving forward right now. Peel that amount
    // off into its own part record advancing to the next stage; the
    // remainder stays behind at the current stage, unassigned, so it's
    // free for anyone (or another machine) to pick up next — independent
    // of the batching feature entirely.
    const remaining = total - qty;
    const advancedRef = db.collection("parts").doc();
    writeBatch.set(advancedRef, {
      submissionId: part.submissionId,
      jobType: part.jobType,
      quantity: qty,
      material: part.material || null,
      color: part.color || null,
      batchable: part.batchable || false,
      status: next,
      statusHistory: [{
        status: next,
        timestamp: new Date().toISOString(),
        actor: currentUser.name,
        note: `${qty} of ${total} moved forward — ${remaining} remain at "${currentStatus}"`,
      }],
      currentAssignee: currentUser.name,
      handoffNote: null,
      fileRef: part.fileRef || null,
      downloadUrl: part.downloadUrl || null,
      thumbnailDataUrl: part.thumbnailDataUrl || null,
      printerId: null,
      batchId: null,
      splitFromPartId: part.id,
    });

    writeBatch.update(db.collection("parts").doc(partId), {
      quantity: remaining,
      currentAssignee: null,
      printerId: null,
      splitHistory: firebase.firestore.FieldValue.arrayUnion({
        intoPartId: advancedRef.id,
        quantity: qty,
        timestamp: new Date().toISOString(),
      }),
      statusHistory: firebase.firestore.FieldValue.arrayUnion({
        status: currentStatus,
        timestamp: new Date().toISOString(),
        actor: currentUser.name,
        note: `Sent ${qty} of ${total} forward — ${remaining} left here for anyone to pick up`,
      }),
    });
  }

  await writeBatch.commit();

  if (next === "Complete") {
    sendMilestoneEmailForPart(part, "Complete");
  }

  await refreshQueue();
}

async function sendBackPart(partId, currentStatus) {
  const prev = PREV_STATUS[currentStatus];
  if (!prev) return;

  const updates = {
    status: prev,
    statusHistory: firebase.firestore.FieldValue.arrayUnion({
      status: prev,
      timestamp: new Date().toISOString(),
      actor: currentUser.name,
      note: "Sent back from " + currentStatus,
    }),
  };

  // Landing back at "Submitted" means nobody has claimed it anymore.
  if (prev === "Submitted") {
    updates.currentAssignee = null;
  }
  // Leaving the printing/lasering stage means it's not actually on that machine anymore.
  if (currentStatus === "Printing/Lasering") {
    updates.printerId = null;
  }

  await db.collection("parts").doc(partId).update(updates);
  await refreshQueue();
}

// Escape hatch for submissions that are never going to move forward (e.g. a
// flagged part the student never fixes). Reuses the same "quantity 0" convention
// as a fully-split part, so it just quietly drops out of every active view
// without needing a separate archived/deleted state.
async function withdrawPart(partId) {
  const part = queueCache.parts.find((p) => p.id === partId);
  if (!part) return;
  const sub = queueCache.submissions[part.submissionId];
  const confirmed = confirm(`Withdraw "${sub ? sub.label : "this part"}"? This removes it from the active queue. This can't be undone from here.`);
  if (!confirmed) return;

  await db.collection("parts").doc(partId).update({
    quantity: 0,
    statusHistory: firebase.firestore.FieldValue.arrayUnion({
      status: part.status,
      timestamp: new Date().toISOString(),
      actor: currentUser.name,
      note: "Withdrawn by " + currentUser.name,
    }),
  });

  sendMilestoneEmailForPart(part, "Withdrawn");
  await refreshAfterQueueMutation();
}

async function submitFlag(partId) {
  const checked = document.querySelector(`input[name="flag-cat-${partId}"]:checked`);
  if (!checked) { alert("Choose a reason category first."); return; }
  const category = checked.value;
  const message = document.getElementById(`flag-msg-${partId}`).value.trim();

  await db.collection("parts").doc(partId).update({
    status: "Claimed",
    currentAssignee: currentUser.name,
    failureReason: category,
    flagMessage: message || null,
    statusHistory: firebase.firestore.FieldValue.arrayUnion({
      status: "Claimed",
      timestamp: new Date().toISOString(),
      actor: currentUser.name,
      note: "Flagged: " + category + (message ? " — " + message : ""),
    }),
  });

  const part = queueCache.parts.find((p) => p.id === partId);
  if (part) sendMilestoneEmailForPart(part, "Flagged", { failureReason: category, flagMessage: message || null, actor: currentUser.name });

  flaggingPartId = null;
  await refreshQueue();
}

async function editHandoffNote(partId) {
  const part = queueCache.parts.find((p) => p.id === partId);
  const note = prompt("Handoff note for the next peer leader:", part?.handoffNote || "");
  if (note === null) return;
  await db.collection("parts").doc(partId).update({ handoffNote: note });
  await refreshQueue();
}

/* =========================================================
   BATCHES (overview across all active batches)
========================================================= */
let advancingBatchId = null;

async function renderBatchesPage(main) {
  main.innerHTML = `
    <div class="page-eyebrow">Peer Leader · ${escapeHtml(currentUser.name)}</div>
    <h1 class="page-title">Batches</h1>
    <div style="margin-bottom:16px;"><button class="secondary-btn" onclick="renderBatchesPage(document.getElementById('main'))">Refresh</button></div>
    <div id="batches-list" class="card"><div class="empty-hint">Loading…</div></div>
  `;

  await loadQueueCache();

  const batchedParts = queueCache.parts.filter((p) => p.batchId && (p.quantity ?? 1) > 0);
  const listEl = document.getElementById("batches-list");
  if (!listEl) return;

  if (batchedParts.length === 0) {
    listEl.innerHTML = `<div class="empty-hint">No active batches right now — combine parts from the Live Queue to start one.</div>`;
    return;
  }

  const grouped = {};
  batchedParts.forEach((p) => {
    if (!grouped[p.batchId]) grouped[p.batchId] = [];
    grouped[p.batchId].push(p);
  });

  listEl.innerHTML = Object.entries(grouped).map(([batchId, members]) => {
    const statuses = new Set(members.map((m) => m.status));
    const statusLabel = statuses.size === 1 ? [...statuses][0] : "Mixed stages";
    const canAssignMachine = statuses.size === 1 && [...statuses][0] === "Printing/Lasering";
    const machineOptions = machinesForType(members[0].jobType);
    const currentMachine = members[0].printerId;
    const canAdvance = statuses.size === 1 && !!NEXT_STATUS[members[0].status];

    const memberList = members.map((m) => {
      const sub = queueCache.submissions[m.submissionId];
      const base = `${escapeHtml(sub ? sub.label : "Untitled")} (qty ${m.quantity || 1}${statuses.size > 1 ? ", " + escapeHtml(m.status) : ""})`;
      return m.fileRef ? `${base} — <a href="${m.fileRef}" target="_blank" rel="noopener">file</a>` : base;
    }).join(" · ");

    const isAdvancing = advancingBatchId === batchId;

    return `<div class="list-row" style="flex-direction:column; align-items:stretch; gap:8px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div class="row-title">Batch · ${members.length} parts</div>
          <div class="row-sub">${memberList}</div>
        </div>
        <span class="pill ${statuses.size === 1 ? "gold" : "cardinal"}">${escapeHtml(statusLabel)}</span>
      </div>
      ${currentMachine ? `<div class="row-sub">Machine: ${escapeHtml(machineLabel(currentMachine))}</div>` : ""}
      ${canAssignMachine && machineOptions.length ? `<div class="form-row" style="margin:0;">
        <label class="flag-form-label">Assign to machine</label>
        <select onchange="assignBatchMachine('${batchId}', this.value)">
          <option value="">— Unassigned —</option>
          ${machineOptions.map((m) => `<option value="${m.id}" ${currentMachine === m.id ? "selected" : ""}>${escapeHtml(m.label)}</option>`).join("")}
        </select>
      </div>` : ""}

      ${isAdvancing ? `<div class="flag-form" style="margin-top:0;">
        <div class="flag-form-label">How many of each succeeded on this run?</div>
        <div class="row-sub" style="margin-bottom:10px;">Anything less than the full amount gets split off and sent back a step for another attempt — it won't hold up the pieces that did work.</div>
        ${members.map((m) => {
          const sub = queueCache.submissions[m.submissionId];
          return `<div class="form-row" style="margin-bottom:8px;">
            <label class="flag-form-label">${escapeHtml(sub ? sub.label : "Untitled")}</label>
            <input type="number" min="0" max="${m.quantity || 1}" value="${m.quantity || 1}" id="batch-result-${batchId}-${m.id}" style="max-width:100px;" />
            <span class="row-sub" style="display:inline;"> of ${m.quantity || 1} succeeded</span>
          </div>`;
        }).join("")}
        <div class="queue-actions">
          <button class="mini-btn" onclick="confirmBatchAdvance('${batchId}', [${members.map((m) => `'${m.id}'`).join(",")}])">Confirm</button>
          <button class="mini-btn plain" onclick="advancingBatchId = null; renderBatchesPage(document.getElementById('main'))">Cancel</button>
        </div>
      </div>` : `<div class="queue-actions">
        ${canAdvance ? `<button class="mini-btn" onclick="advancingBatchId='${batchId}'; renderBatchesPage(document.getElementById('main'))">Advance batch…</button>` : ""}
        <button class="mini-btn plain" onclick="dissolveBatch('${batchId}')">Dissolve batch</button>
      </div>`}
    </div>`;
  }).join("");
}

async function confirmBatchAdvance(batchId, memberIds) {
  const resultsMap = {};
  memberIds.forEach((id) => {
    const input = document.getElementById(`batch-result-${batchId}-${id}`);
    resultsMap[id] = input ? parseInt(input.value, 10) : undefined;
  });
  advancingBatchId = null;
  await advanceBatch(batchId, resultsMap);
}
