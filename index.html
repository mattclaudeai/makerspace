<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mill Creek Engineering — Fab Lab Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cardinal: #8B2331; --navy: #0C223F; --navy-deep: #081627;
    --gold: #C7B683; --gold-deep: #AD9563; --cream: #F7F5F0; --paper: #FFFFFF;
    --ink: #1B2230; --slate: #5C6577; --slate-light: #98A1B0; --border: #E5E1D6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  button { font-family: inherit; cursor: pointer; }

  #login-screen { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: var(--navy-deep); }
  #login-screen::before { content: ""; position: absolute; inset: 0; background: radial-gradient(600px circle at 20% 20%, var(--navy) 0%, transparent 60%); }
  .login-accent-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--cardinal), var(--gold)); }
  .login-card { position: relative; z-index: 1; width: 380px; padding: 32px; border-radius: 16px; background: var(--paper); }
  .brand-row { display: flex; align-items: center; gap: 8px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--cardinal); display: flex; align-items: center; justify-content: center; color: var(--gold); font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .brand-eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--slate-light); }
  .login-title { font-size: 20px; font-weight: 600; margin: 16px 0 4px; }
  .login-sub { font-size: 14px; color: var(--slate); margin: 0 0 24px; }
  .google-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: white; font-size: 14px; font-weight: 500; color: var(--ink); }
  .google-btn:hover { background: #FAFAF9; }
  .login-footnote { font-size: 11px; text-align: center; margin-top: 16px; color: var(--slate-light); }
  .login-error { font-size: 12px; color: var(--cardinal); background: #8B233114; border: 1px solid var(--cardinal); border-radius: 8px; padding: 10px 12px; margin-top: 14px; display: none; }

  #app-screen { display: none; width: 100vw; height: 100vh; }
  #app-screen.visible { display: flex; }
  #sidebar { width: 248px; flex-shrink: 0; background: var(--navy); display: flex; flex-direction: column; }
  .sidebar-header { display: flex; align-items: center; gap: 8px; padding: 20px; }
  .sidebar-brand-name { font-size: 14px; font-weight: 600; color: var(--cream); line-height: 1.2; }
  .sidebar-brand-sub { font-size: 11px; color: var(--gold); }
  #nav-list { flex: 1; padding: 8px 12px; margin-top: 8px; }
  .nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 12px; margin-bottom: 2px; border-radius: 8px; border: none; background: transparent; color: #9AA6BB; font-size: 14px; border-left: 2px solid transparent; text-align: left; }
  .nav-item.active { background: #FFFFFF12; color: var(--cream); border-left: 2px solid var(--gold); }
  .nav-item:not(.active):hover { background: #FFFFFF08; }
  .nav-item.disabled { opacity: 0.4; cursor: default; }
  .account-row { display: flex; align-items: center; gap: 10px; padding: 16px; border-top: 1px solid #FFFFFF14; }
  .account-avatar { width: 32px; height: 32px; border-radius: 999px; background: var(--gold); color: var(--navy); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; overflow: hidden; }
  .account-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .account-name { font-size: 12px; font-weight: 500; color: var(--cream); }
  .account-role { font-size: 11px; color: #7E8AA0; }
  .account-row button { margin-left: auto; background: none; border: none; display: flex; }

  .preview-wrap { padding: 0 12px 8px; position: relative; }
  .preview-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 8px; border: none; background: #FFFFFF08; color: #9AA6BB; font-size: 12px; }
  .preview-btn b { color: var(--gold); font-weight: 500; }
  .preview-menu { display: none; position: absolute; bottom: 44px; left: 12px; right: 12px; border-radius: 8px; overflow: hidden; background: var(--navy-deep); border: 1px solid #FFFFFF14; z-index: 20; }
  .preview-menu.open { display: block; }
  .preview-menu button { width: 100%; text-align: left; padding: 8px 12px; font-size: 12px; border: none; background: transparent; color: #C7CEDA; }
  .preview-menu button.current { color: var(--gold); }
  .preview-menu button:hover { background: #FFFFFF08; }

  #main { flex: 1; overflow-y: auto; padding: 32px; }
  .page-eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--slate-light); margin-bottom: 4px; }
  .page-title { font-size: 24px; font-weight: 600; margin: 0 0 24px; }
  .card { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; }
  .pill { font-size: 12px; font-weight: 500; padding: 4px 8px; border-radius: 999px; letter-spacing: 0.02em; }
  .pill.neutral { background: #EEEBE2; color: var(--slate); }
  .pill.gold { background: rgba(199,182,131,0.13); color: var(--gold-deep); }
  .pill.cardinal { background: rgba(139,35,49,0.08); color: var(--cardinal); }
  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; }
  .list-row + .list-row { border-top: 1px solid var(--border); }
  .row-title { font-size: 14px; font-weight: 500; }
  .row-sub { font-size: 12px; color: var(--slate-light); margin-top: 2px; }
  .empty-hint { padding: 32px; text-align: center; color: var(--slate-light); font-size: 13px; }

  .path-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .path-card { padding: 20px; display: flex; flex-direction: column; gap: 10px; text-align: left; border: 1px solid var(--border); background: var(--paper); border-radius: 12px; }
  .path-card.selected { border-color: var(--gold-deep); box-shadow: 0 0 0 2px rgba(199,182,131,0.3); }
  .path-card h3 { font-size: 14px; margin: 0; }
  .path-card p { font-size: 12px; color: var(--slate); line-height: 1.5; margin: 0; }

  .form-section { padding: 24px; margin-bottom: 20px; }
  .form-row { margin-bottom: 16px; }
  label.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--slate); margin-bottom: 6px; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: 'Inter';
  }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .file-drop { border: 1.5px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center; font-size: 13px; color: var(--slate); margin-top: 8px; }
  .file-drop.has-file { border-color: var(--gold-deep); color: var(--ink); }
  .primary-btn { background: var(--navy); color: white; border: none; padding: 11px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .primary-btn:hover { background: #16305c; }
  .primary-btn:disabled { opacity: 0.5; cursor: default; }
  .status-msg { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-top: 14px; display: none; }
  .status-msg.pending { background: #EEEBE2; color: var(--slate); display: block; }
  .status-msg.success { background: rgba(199,182,131,0.13); color: var(--gold-deep); display: block; }
  .status-msg.error { background: #8B233114; color: var(--cardinal); display: block; }

  .secondary-btn { background: transparent; color: var(--slate); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; }
  .secondary-btn:hover { background: #EFEDE5; }

  .queue-cols { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; align-items: start; }
  .queue-col { border-radius: 12px; padding: 12px; background: #EFEDE5; min-height: 140px; }
  .queue-col-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--slate); margin-bottom: 12px; }
  .queue-empty { font-size: 12px; color: var(--slate-light); }
  .queue-card { font-size: 12px; padding: 10px; border-radius: 8px; background: var(--paper); border: 1px solid var(--border); line-height: 1.4; margin-bottom: 10px; }
  .queue-card-title { font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
  .queue-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .mini-btn { font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 6px; border: none; background: var(--navy); color: white; }
  .mini-btn.danger { background: var(--cardinal); }
  .mini-btn.plain { background: #EEEBE2; color: var(--slate); }
  .flag-note { background: rgba(139,35,49,0.08); color: var(--cardinal); padding: 6px 8px; border-radius: 6px; font-size: 11px; margin: 6px 0; }
  .flag-form { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .flag-form-label { font-size: 11px; font-weight: 600; color: var(--slate); margin-bottom: 4px; }
  .flag-radio { display: block; font-size: 12px; color: var(--ink); margin-bottom: 4px; }
  .flag-form textarea { width: 100%; font-family: 'Inter'; font-size: 12px; padding: 6px; border: 1px solid var(--border); border-radius: 6px; margin-top: 4px; resize: vertical; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-accent-bar"></div>
  <div class="login-card">
    <div class="brand-row">
      <div class="brand-mark">M</div>
      <span class="brand-eyebrow">Mill Creek Engineering</span>
    </div>
    <h1 class="login-title">Print &amp; laser queue</h1>
    <p class="login-sub">Sign in with your school Google account to submit or manage jobs.</p>
    <button class="google-btn" id="google-signin-btn">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.63h6.47c-.28 1.5-1.13 2.78-2.4 3.63v3.02h3.89c2.28-2.1 3.56-5.19 3.56-8.83z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.89-3.02c-1.08.73-2.46 1.16-4.06 1.16-3.12 0-5.77-2.1-6.71-4.93H1.27v3.1C3.25 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.29 14.31c-.24-.73-.38-1.5-.38-2.31s.14-1.58.38-2.31V6.59H1.27C.46 8.23 0 10.06 0 12s.46 3.77 1.27 5.41l4.02-3.1z"/><path fill="#EA4335" d="M12 4.77c1.76 0 3.34.6 4.59 1.79l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.59l4.02 3.1C6.23 6.86 8.88 4.77 12 4.77z"/></svg>
      Continue with Google
    </button>
    <div class="login-error" id="login-error"></div>
    <p class="login-footnote">Restricted to district Workspace accounts</p>
  </div>
</div>

<div id="app-screen">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand-mark">M</div>
      <div>
        <div class="sidebar-brand-name">Mill Creek</div>
        <div class="sidebar-brand-sub">Fab Lab Queue</div>
      </div>
    </div>
    <nav id="nav-list"></nav>
    <div class="preview-wrap" id="preview-wrap"></div>
    <div class="account-row">
      <div class="account-avatar" id="account-avatar"></div>
      <div>
        <div class="account-name" id="account-name"></div>
        <div class="account-role" id="account-role"></div>
      </div>
      <button onclick="signOutUser()" title="Sign out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7E8AA0" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<!-- Firebase (compat SDK — no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   CONFIG — the only things you should need to edit
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAu-wxO-5Jr1jQvAH-gL6aYdoZD3yyNuKQ",
  authDomain: "makerspace-45087.firebaseapp.com",
  projectId: "makerspace-45087",
  storageBucket: "makerspace-45087.firebasestorage.app",
  messagingSenderId: "288948328757",
  appId: "1:288948328757:web:75791b67ddaaf30404147c",
  measurementId: "G-7055KGRPZD"
};

// TODO: replace with your real district Workspace domain, e.g. "millcreekschools.org"
const SCHOOL_DOMAIN = "REPLACE_WITH_YOUR_SCHOOL_DOMAIN";

// TODO: replace with your real Apps Script /exec deployment URL (Execute as: Me)
const APPS_SCRIPT_URL = "REPLACE_WITH_YOUR_APPS_SCRIPT_EXEC_URL";

/* =========================================================
   INIT
========================================================= */
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentRole = "student";        // the REAL role, from Firestore users/{email}
let currentStudentNumber = null;     // real roster ID if imported, else falls back to email
let previewRole = null;              // teacher-only "view as" override, does not change real permissions
let state = { page: "home", submitPath: null, submitJobType: null, submitFile: null, previewMenuOpen: false };

const NAV = {
  student: [
    { key: "home", label: "Dashboard", enabled: true },
    { key: "submit", label: "Submit a Job", enabled: true },
    { key: "learn", label: "Learning", enabled: false },
  ],
  peer_leader: [
    { key: "queue", label: "Live Queue", enabled: true },
    { key: "batches", label: "Batches", enabled: false },
    { key: "printers", label: "Printer Status", enabled: false },
  ],
  teacher: [
    { key: "overview", label: "Overview", enabled: false },
    { key: "reports", label: "Reports", enabled: false },
    { key: "fleet", label: "Printer Fleet", enabled: false },
    { key: "roster", label: "Roster", enabled: false },
    { key: "queue", label: "Live Queue", enabled: true },
  ],
};
const ROLE_LABEL = { student: "Student", peer_leader: "Peer Leader", teacher: "Teacher / Admin" };

/* =========================================================
   AUTH
========================================================= */
document.getElementById("google-signin-btn").addEventListener("click", signIn);

function signIn() {
  const provider = new firebase.auth.GoogleAuthProvider();
  if (SCHOOL_DOMAIN && SCHOOL_DOMAIN !== "REPLACE_WITH_YOUR_SCHOOL_DOMAIN") {
    provider.setCustomParameters({ hd: SCHOOL_DOMAIN }); // hints Google to show school accounts first
  }
  auth.signInWithPopup(provider).catch(err => showLoginError("Sign-in failed: " + err.message));
}

function signOutUser() {
  auth.signOut();
}

function showLoginError(msg) {
  const el = document.getElementById("login-error");
  el.textContent = msg;
  el.style.display = "block";
}

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    currentUser = null;
    document.getElementById("app-screen").classList.remove("visible");
    document.getElementById("login-screen").style.display = "flex";
    return;
  }

  // Domain check — the "hd" param above only hints the account picker, it doesn't
  // actually enforce anything. This is the real enforcement.
  if (SCHOOL_DOMAIN && SCHOOL_DOMAIN !== "REPLACE_WITH_YOUR_SCHOOL_DOMAIN" &&
      !user.email.endsWith("@" + SCHOOL_DOMAIN)) {
    showLoginError("Please sign in with your school (" + SCHOOL_DOMAIN + ") account.");
    auth.signOut();
    return;
  }

  currentUser = user;

  // Users are keyed by EMAIL, not Firebase's internal uid — see the roster
  // import setup for why. This lookup also doubles as the real access gate:
  // only people already imported from the roster sheet get in at all.
  const userDocRef = db.collection("users").doc(user.email);
  const userDoc = await userDocRef.get();

  if (!userDoc.exists) {
    // Not on the roster — domain restriction alone isn't enough, since any
    // district account (not just this class/lab's students) can pass that
    // check. Block access rather than silently defaulting them to student.
    showLoginError("This account isn't on the Fab Lab roster yet. Ask your teacher to add you.");
    auth.signOut();
    return;
  }

  const d = userDoc.data();
  currentRole = d.role || "student";
  currentStudentNumber = d.studentNumber || user.email;

  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").classList.add("visible");
  previewRole = null;
  state.page = NAV[currentRole][0].key;
  renderShell();
});

/* =========================================================
   SHELL RENDER (sidebar + account)
========================================================= */
function effectiveRole() {
  return previewRole || currentRole;
}

function renderShell() {
  const nav = NAV[effectiveRole()];
  document.getElementById("nav-list").innerHTML = nav.map(item => {
    const active = state.page === item.key;
    const disabledClass = item.enabled ? "" : "disabled";
    return `<button class="nav-item ${active ? "active" : ""} ${disabledClass}"
      onclick="${item.enabled ? `setPage('${item.key}')` : ""}">${item.label}${item.enabled ? "" : " · soon"}</button>`;
  }).join("");

  document.getElementById("account-name").textContent = currentUser.displayName || currentUser.email;
  document.getElementById("account-role").textContent =
    previewRole ? `${ROLE_LABEL[currentRole]} · previewing ${ROLE_LABEL[previewRole]}` : ROLE_LABEL[currentRole];
  const avatarEl = document.getElementById("account-avatar");
  avatarEl.innerHTML = currentUser.photoURL
    ? `<img src="${currentUser.photoURL}" />`
    : (currentUser.displayName || currentUser.email)[0].toUpperCase();

  renderPreviewToggle();
  renderMain();
}

// Only real teachers get the "preview as" switcher — it changes what UI
// renders, not what Firestore will actually let you read/write. A teacher
// previewing "Student" still has teacher-level Firestore permissions under
// the hood, so this is for showing students their screen / UI troubleshooting,
// not a true permissions simulator.
function renderPreviewToggle() {
  const wrap = document.getElementById("preview-wrap");
  if (currentRole !== "teacher") {
    wrap.innerHTML = "";
    return;
  }
  wrap.innerHTML = `
    <button class="preview-btn" onclick="togglePreviewMenu()">
      <span>Preview as: <b>${ROLE_LABEL[effectiveRole()]}</b></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="preview-menu ${state.previewMenuOpen ? "open" : ""}" id="preview-menu">
      ${Object.keys(NAV).map(r => `<button class="${r === effectiveRole() ? "current" : ""}" onclick="setPreviewRole('${r}')">${ROLE_LABEL[r]}</button>`).join("")}
    </div>
  `;
}

function togglePreviewMenu() {
  state.previewMenuOpen = !state.previewMenuOpen;
  renderPreviewToggle();
}

function setPreviewRole(r) {
  previewRole = (r === currentRole) ? null : r;
  state.previewMenuOpen = false;
  state.page = NAV[effectiveRole()][0].key;
  renderShell();
}

function setPage(key) {
  state.page = key;
  state.submitPath = null; state.submitJobType = null; state.submitFile = null;
  renderShell();
}

/* =========================================================
   MAIN PAGE ROUTER
========================================================= */
function renderMain() {
  const main = document.getElementById("main");
  if (state.page === "home") return renderHome(main);
  if (state.page === "submit") return renderSubmit(main);
  if (state.page === "queue") return renderQueue(main);
  main.innerHTML = `<div class="empty-hint">This page isn't built yet.</div>`;
}

/* =========================================================
   HOME / DASHBOARD — real Firestore query
========================================================= */
async function renderHome(main) {
  main.innerHTML = `
    <div class="page-eyebrow">Student · ${currentUser.email}</div>
    <h1 class="page-title">Your submissions</h1>
    <div class="card" id="submissions-list"><div class="empty-hint">Loading…</div></div>
  `;

  const snap = await db.collection("submissions")
    .where("studentNumber", "==", currentStudentNumber)
    .orderBy("createdAt", "desc")
    .get();

  if (snap.empty) {
    document.getElementById("submissions-list").innerHTML =
      `<div class="empty-hint">No submissions yet — head to "Submit a Job" to start one.</div>`;
    return;
  }

  const rowsHtml = [];
  for (const doc of snap.docs) {
    const sub = doc.data();
    const partsSnap = await db.collection("parts").where("submissionId", "==", doc.id).get();
    const total = partsSnap.size;
    const complete = partsSnap.docs.filter(p => ["Complete", "Picked up"].includes(p.data().status)).length;
    const flagged = partsSnap.docs.some(p => (p.data().status || "").startsWith("Flagged"));
    const tone = flagged ? "cardinal" : (complete === total && total > 0) ? "gold" : "neutral";
    const statusLabel = flagged ? "Flagged — see part detail" : `${complete} of ${total} parts complete`;

    rowsHtml.push(`<div class="list-row">
      <div>
        <div class="row-title">${escapeHtml(sub.label || "Untitled submission")}</div>
        <div class="row-sub">${statusLabel}</div>
      </div>
      <span class="pill ${tone}">${escapeHtml(sub.overallStatus || "Submitted")}</span>
    </div>`);
  }
  document.getElementById("submissions-list").innerHTML = rowsHtml.join("");
}

/* =========================================================
   SUBMIT — guided flow, writes real Firestore docs + uploads file via Apps Script
========================================================= */
function renderSubmit(main) {
  const paths = [
    { key: "solo", title: "Solo, student-sliced", tag: "Default", body: "Upload the .3mf you've already sliced in Bambu Studio." },
    { key: "batch", title: "Add to batch", tag: "Non-urgent", body: "Upload a raw STL. A peer leader will combine it with others." },
    { key: "assisted", title: "Peer-leader slices for you", tag: "New to Bambu Studio", body: "Upload a raw STL — a peer leader will slice it directly." },
  ];

  // Dynamic help banner based on selected path
  let pathBanner = "";
  if (state.submitPath === "solo") {
    pathBanner = `<div class="flag-note" style="background: rgba(199,182,131,0.15); color: var(--navy); margin-bottom: 16px;">
      <b>Solo Path:</b> Upload your pre-sliced <code>.3mf</code> file directly from Bambu Studio.
    </div>`;
  } else if (state.submitPath === "batch") {
    pathBanner = `<div class="flag-note" style="background: rgba(199,182,131,0.15); color: var(--navy); margin-bottom: 16px;">
      <b>Batching Bin:</b> Upload a raw <code>.stl</code> file. A peer leader will combine this with other jobs onto a single build plate.
    </div>`;
  } else if (state.submitPath === "assisted") {
    pathBanner = `<div class="flag-note" style="background: rgba(199,182,131,0.15); color: var(--navy); margin-bottom: 16px;">
      <b>Assisted Path:</b> Upload a raw <code>.stl</code> file. A peer leader will review and slice the file for you.
    </div>`;
  }

  main.innerHTML = `
    <div class="page-eyebrow">Student · New submission</div>
    <h1 class="page-title">Submit a job</h1>

    <div class="path-grid">
      ${paths.map(p => `<button class="path-card ${state.submitPath === p.key ? "selected" : ""}" onclick="selectPath('${p.key}')">
        <h3>${escapeHtml(p.title)}</h3>
        <span class="pill gold">${escapeHtml(p.tag)}</span>
        <p>${escapeHtml(p.body)}</p>
      </button>`).join("")}
    </div>

    <div class="card form-section" id="submit-form" style="${state.submitPath ? "" : "display:none;"}">
      ${pathBanner}
      <div class="form-row">
        <label class="field-label">Submission label</label>
        <input type="text" id="f-label" placeholder="e.g. Bracket assembly" />
      </div>
      <div class="two-col">
        <div class="form-row">
          <label class="field-label">Job type</label>
          <select id="f-jobtype" onchange="onJobTypeChange()">
            <option value="print">3D Print</option>
            <option value="laser">Laser</option>
          </select>
        </div>
        <div class="form-row">
          <label class="field-label">Quantity</label>
          <input type="number" id="f-quantity" min="1" value="1" />
        </div>
      </div>
      <div class="two-col">
        <div class="form-row">
          <label class="field-label" id="f-material-label">Material</label>
          <input type="text" id="f-material" placeholder="e.g. PLA" />
        </div>
        <div class="form-row">
          <label class="field-label">Color</label>
          <input type="text" id="f-color" placeholder="e.g. Cardinal red" />
        </div>
      </div>
      <div class="form-row">
        <label class="field-label" id="f-file-label">File</label>
        <input type="file" id="f-file" onchange="onFileChosen()" />
        <div class="file-drop" id="file-drop-hint">No file selected yet</div>
      </div>
      <div class="form-row">
        <button class="primary-btn" id="submit-btn" onclick="submitJob()">Submit job</button>
      </div>
      <div class="status-msg" id="submit-status"></div>
    </div>
  `;
  onJobTypeChange();
}

function onJobTypeChange() {
  const jobType = document.getElementById("f-jobtype").value;
  state.submitJobType = jobType;
  const fileInput = document.getElementById("f-file");
  const fileLabel = document.getElementById("f-file-label");
  const materialLabel = document.getElementById("f-material-label");

  if (jobType === "print") {
    materialLabel.textContent = "Material";
    if (state.submitPath === "solo") {
      fileInput.accept = ".3mf";
      fileLabel.textContent = "File (sliced .3mf required)";
    } else {
      fileInput.accept = ".stl";
      fileLabel.textContent = "File (raw .stl required)";
    }
  } else {
    fileInput.accept = ".ai,.pdf";
    fileLabel.textContent = "File (.ai or .pdf)";
    materialLabel.textContent = "Material (e.g. 1/8in acrylic, plywood)";
  }
}
function selectPath(key) {
  state.submitPath = key;
  renderSubmit(document.getElementById("main"));
}

function onFileChosen() {
  const fileInput = document.getElementById("f-file");
  const hint = document.getElementById("file-drop-hint");
  if (fileInput.files.length > 0) {
    state.submitFile = fileInput.files[0];
    hint.textContent = "Selected: " + state.submitFile.name;
    hint.classList.add("has-file");
  } else {
    state.submitFile = null;
    hint.textContent = "No file selected yet";
    hint.classList.remove("has-file");
  }
}

function setSubmitStatus(kind, text) {
  const el = document.getElementById("submit-status");
  el.className = "status-msg " + kind;
  el.textContent = text;
}

async function submitJob() {
  const label = document.getElementById("f-label").value.trim();
  const jobType = document.getElementById("f-jobtype").value;
  const quantity = parseInt(document.getElementById("f-quantity").value, 10) || 1;
  const material = document.getElementById("f-material").value.trim();
  const color = document.getElementById("f-color").value.trim();

  if (!label) { setSubmitStatus("error", "Give this submission a label first."); return; }
  if (!state.submitFile) { setSubmitStatus("error", "Choose a file to upload."); return; }

  document.getElementById("submit-btn").disabled = true;
  setSubmitStatus("pending", "Creating submission…");

  try {
    // 1. Create the parent submission doc.
    const submissionRef = await db.collection("submissions").add({
      studentNumber: currentStudentNumber,
      label,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      overallStatus: "Submitted",
    });

    // 2. Create the part doc.
    const partRef = await db.collection("parts").add({
      submissionId: submissionRef.id,
      jobType,
      quantity,
      material,
      color,
      batchable: state.submitPath === "batch",
      status: "Submitted",
      statusHistory: [{
        status: "Submitted",
        timestamp: new Date().toISOString(),
        actor: currentUser.email,
        note: state.submitPath === "assisted" ? "Peer-leader slicing requested" : null,
      }],
      currentAssignee: null,
      handoffNote: null,
      fileRef: null,
    });

    // 3. Upload the file via Apps Script (the browser can't write to Drive directly here).
    setSubmitStatus("pending", "Uploading file…");
    const fileUrl = await uploadFileViaAppsScript(state.submitFile, submissionRef.id, partRef.id);

    // 4. Store the resulting Drive link back on the part.
    await db.collection("parts").doc(partRef.id).update({ fileRef: fileUrl });

    setSubmitStatus("success", "Submitted! Head to your dashboard to track it.");
    setTimeout(() => setPage("home"), 1200);
  } catch (err) {
    setSubmitStatus("error", "Something went wrong: " + err.message);
    document.getElementById("submit-btn").disabled = false;
  }
}

function uploadFileViaAppsScript(file, submissionId, partId) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = reader.result.split(",")[1]; // strip "data:...;base64,"
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight
          body: JSON.stringify({
            action: "uploadFile",
            submissionId,
            partId,
            fileName: file.name,
            mimeType: file.type || "application/octet-stream",
            fileDataBase64: base64,
          }),
        });
        const data = await res.json();
        if (!data.ok) return reject(new Error(data.error || "Upload failed"));
        resolve(data.fileUrl);
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = () => reject(new Error("Couldn't read the file"));
    reader.readAsDataURL(file);
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* =========================================================
   LIVE QUEUE (Phase 2) — peer leader / teacher only
========================================================= */
const PIPELINE = ["Submitted", "Claimed", "Prepping/slicing", "Printing/Lasering", "Complete", "Picked up"];
const NEXT_STATUS = {
  "Submitted": "Claimed",
  "Claimed": "Prepping/slicing",
  "Prepping/slicing": "Printing/Lasering",
  "Printing/Lasering": "Complete",
  "Complete": "Picked up",
};
const NEXT_LABEL = {
  "Submitted": "Claim",
  "Claimed": "Start prepping",
  "Prepping/slicing": "Start run",
  "Printing/Lasering": "Mark complete",
  "Complete": "Mark picked up",
};
const FLAG_CATEGORIES = ["warped", "wrong file", "wrong scale", "machine issue", "other"];

let flaggingPartId = null;
let queueCache = { parts: [], submissions: {} };

async function renderQueue(main) {
  main.innerHTML = `
    <div class="page-eyebrow">Peer Leader · ${escapeHtml(currentUser.displayName || currentUser.email)}</div>
    <h1 class="page-title">Live queue</h1>
    <div style="margin-bottom:16px;"><button class="secondary-btn" onclick="refreshQueue()">Refresh</button></div>
    <div id="queue-cols" class="queue-cols"><div class="empty-hint">Loading…</div></div>
  `;
  flaggingPartId = null;
  await refreshQueue();
}

async function refreshQueue() {
  const partsSnap = await db.collection("parts").get();
  const parts = partsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  // Fetch each related submission once (not once per part) so labels can show.
  const subIds = [...new Set(parts.map(p => p.submissionId).filter(Boolean))];
  const subMap = {};
  await Promise.all(subIds.map(async (id) => {
    const doc = await db.collection("submissions").doc(id).get();
    subMap[id] = doc.exists ? doc.data() : { label: "Unknown submission" };
  }));
  queueCache = { parts, submissions: subMap };

  const cols = document.getElementById("queue-cols");
  if (!cols) return; // navigated away before this resolved
  cols.innerHTML = PIPELINE.map((status) => {
    const items = parts.filter((p) => p.status === status);
    return `<div class="queue-col">
      <div class="queue-col-title">${status} (${items.length})</div>
      ${items.length === 0
        ? `<div class="queue-empty">—</div>`
        : items.map((p) => renderQueueCard(p, subMap[p.submissionId])).join("")}
    </div>`;
  }).join("");
}

function renderQueueCard(part, submission) {
  const label = submission ? submission.label : "Unknown submission";
  const flagged = !!part.failureReason && part.status === "Claimed";
  const nextLabel = NEXT_LABEL[part.status];
  const showFlagBtn = ["Claimed", "Prepping/slicing", "Printing/Lasering"].includes(part.status);
  const jobIcon = part.jobType === "laser" ? "Laser" : "Print";

  return `<div class="queue-card">
    <div class="queue-card-title">${escapeHtml(label)}</div>
    <div class="row-sub mono">${jobIcon} · qty ${part.quantity || 1}${part.material ? " · " + escapeHtml(part.material) : ""}</div>
    ${flagged ? `<div class="flag-note">Flagged — ${escapeHtml(part.failureReason)}${part.flagMessage ? ": " + escapeHtml(part.flagMessage) : ""}</div>` : ""}
    ${part.currentAssignee ? `<div class="row-sub">Assignee: ${escapeHtml(part.currentAssignee)}</div>` : ""}
    ${part.handoffNote ? `<div class="row-sub">Note: ${escapeHtml(part.handoffNote)}</div>` : ""}
    ${flaggingPartId === part.id
      ? renderFlagForm(part.id)
      : `<div class="queue-actions">
          ${nextLabel ? `<button class="mini-btn" onclick="advancePart('${part.id}','${part.status}')">${nextLabel}</button>` : ""}
          ${showFlagBtn ? `<button class="mini-btn danger" onclick="openFlagForm('${part.id}')">Flag issue</button>` : ""}
          <button class="mini-btn plain" onclick="editHandoffNote('${part.id}')">Note</button>
        </div>`}
  </div>`;
}

function renderFlagForm(partId) {
  return `<div class="flag-form">
    <div class="flag-form-label">Reason</div>
    ${FLAG_CATEGORIES.map((c) => `<label class="flag-radio"><input type="radio" name="flag-cat-${partId}" value="${c}"> ${c}</label>`).join("")}
    <textarea id="flag-msg-${partId}" rows="2" placeholder="Optional message to the student…"></textarea>
    <div class="queue-actions">
      <button class="mini-btn" onclick="submitFlag('${partId}')">Submit flag</button>
      <button class="mini-btn plain" onclick="cancelFlagForm()">Cancel</button>
    </div>
  </div>`;
}

function openFlagForm(partId) {
  flaggingPartId = partId;
  refreshQueue();
}
function cancelFlagForm() {
  flaggingPartId = null;
  refreshQueue();
}

async function advancePart(partId, currentStatus) {
  const next = NEXT_STATUS[currentStatus];
  if (!next) return;
  await db.collection("parts").doc(partId).update({
    status: next,
    currentAssignee: currentUser.email,
    // Advancing a job also clears any prior flag once it's moving forward again —
    // the flag's job was to route it back to Claimed for another look, not to
    // follow it around forever once someone's acted on it.
    failureReason: null,
    flagMessage: null,
    statusHistory: firebase.firestore.FieldValue.arrayUnion({
      status: next,
      timestamp: new Date().toISOString(),
      actor: currentUser.email,
      note: null,
    }),
  });
  await refreshQueue();
}

async function submitFlag(partId) {
  const checked = document.querySelector(`input[name="flag-cat-${partId}"]:checked`);
  if (!checked) { alert("Choose a reason category first."); return; }
  const category = checked.value;
  const message = document.getElementById(`flag-msg-${partId}`).value.trim();

  await db.collection("parts").doc(partId).update({
    status: "Claimed",
    currentAssignee: currentUser.email,
    failureReason: category,
    flagMessage: message || null,
    statusHistory: firebase.firestore.FieldValue.arrayUnion({
      status: "Claimed",
      timestamp: new Date().toISOString(),
      actor: currentUser.email,
      note: "Flagged: " + category + (message ? " — " + message : ""),
    }),
  });
  flaggingPartId = null;
  await refreshQueue();
}

async function editHandoffNote(partId) {
  const part = queueCache.parts.find((p) => p.id === partId);
  const note = prompt("Handoff note for the next peer leader:", part?.handoffNote || "");
  if (note === null) return; // cancelled
  await db.collection("parts").doc(partId).update({ handoffNote: note });
  await refreshQueue();
}
